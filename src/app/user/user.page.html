<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title class="center-title">我的</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openSettings()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
        <span class="button-label">设置</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- 用户信息卡片 -->
  <ion-card>
    <ion-card-content style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <!-- 头像 - 点击修改头像 -->
        <ion-avatar style="width: 60px; height: 60px; cursor: pointer;" (click)="changeAvatar()">
          <img [src]="avatar">
        </ion-avatar>
        <div>
          <!-- 用户名区域 - 点击查看个人资料 -->
          <h2 style="cursor: pointer;" (click)="showProfile()">{{ username || '用户' }}</h2>
          <p>{{ email || '暂无邮箱' }}</p>
          <p style="font-size: 12px; color: #999;">{{ phone || '未绑定手机' }}</p>
        </div>
      </div>
      <ion-icon name="qr-code-outline" style="font-size: 32px; cursor: pointer;" (click)="showQRCode()">
      </ion-icon>
    </ion-card-content>
  </ion-card>

  <!-- 功能按钮卡片 -->
  <ion-card>
    <ion-card-content>
      <div class="function-grid">
        <div *ngFor="let func of functionButtons" class="function-item" (click)="handleFunctionClick(func)">
          <div class="function-icon">
            <ion-icon [name]="func.icon"></ion-icon>
          </div>
          <ion-label>{{ func.name }}</ion-label>
          <!-- 购物车角标 -->
          <ion-badge *ngIf="func.name === '购物车' && cartCount > 0" class="cart-badge">
            {{ cartCount }}
          </ion-badge>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
