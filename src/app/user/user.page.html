<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title class="center-title">我的</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openSettings()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
        <span class="button-label">设置</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- 用户信息卡片 -->
  <ion-card>
    <ion-card-content>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 16px; flex: 1;">
          <!-- 头像 -->
          <div class="avatar-section" (click)="goToUserDetail()">
            <ion-avatar class="user-avatar">
              <img [src]="user.avatar || 'https://ionicframework.com/docs/img/demos/avatar.svg'" alt="avatar">
            </ion-avatar>
            <div class="avatar-edit-icon">
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </div>
          </div>
          
          <!-- ✅ 用户信息：昵称 + 个人简介 -->
          <div class="user-info">
            <h2 class="user-name">{{ user.name || username || '点击头像登录' }}</h2>
            <p class="user-bio">{{ user.bio || bio || '这个人很懒，什么都没写' }}</p>
          </div>
        </div>
        
        <!-- 二维码图标 -->
        <ion-icon name="qr-code-outline" style="font-size: 32px; cursor: pointer;" (click)="showQRCode()">
        </ion-icon>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- 功能按钮卡片 -->
  <ion-card>
    <ion-card-content>
      <div class="function-grid">
        <div *ngFor="let func of functionButtons" class="function-item" (click)="handleFunctionClick(func)">
          <div class="function-icon">
            <ion-icon [name]="func.icon"></ion-icon>
          </div>
          <ion-label>{{ func.name }}</ion-label>
          <ion-badge *ngIf="func.name === '购物车' && cartCount > 0" class="cart-badge">
            {{ cartCount }}
          </ion-badge>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
