<ion-app>
  <ion-router-outlet></ion-router-outlet>
  
  <!-- 底部导航栏：只在登录成功后显示 -->
  <ion-tabs *ngIf="showTabs">
    <ion-tab-bar slot="bottom">
      <ion-tab-button (click)="goToHome()">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>主页</ion-label>
      </ion-tab-button>
      
      <ion-tab-button (click)="goToCategory()">
        <ion-icon name="apps-outline"></ion-icon>
        <ion-label>分类</ion-label>
      </ion-tab-button>
      
      <ion-tab-button (click)="openCamera()">
        <ion-icon name="camera-outline"></ion-icon>
        <ion-label>拍照</ion-label>
      </ion-tab-button>
      
      <ion-tab-button (click)="goToMessages()" class="relative-pos">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <ion-label>消息</ion-label>
        <ion-badge 
          *ngIf="totalUnreadCount > 0" 
          class="tab-badge" 
          [class.two-digit]="totalUnreadCount >= 10 && totalUnreadCount <= 99"
          [class.large-number]="totalUnreadCount > 99">
          {{ totalUnreadCount > 99 ? '99+' : totalUnreadCount }}
        </ion-badge>
      </ion-tab-button>
      
      <ion-tab-button (click)="goToUser()">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>我的</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
