<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title class="center-title">我的</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openSettings()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
          <span class="button-label">设置</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>



<ion-content>
  <!-- 用户信息卡片 -->
  <ion-card>
    <ion-card-content style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <ion-avatar style="width: 40px; height: 40px;"
        (click)="checkLogin()">
          <img [src]="avatar || 'https://ionicframework.com/docs/img/demos/avatar.svg'">
        </ion-avatar>
        <div>
          <h2>{{ username || '用户' }}</h2>
          <p>{{ email || '暂无邮箱' }}</p>
          <p style="font-size: 12px; color: #999;">{{ phone || '未绑定手机' }}</p>
        </div>
      </div>
      
      <ion-icon 
        name="qr-code-outline" 
        style="font-size: 32px; cursor: pointer;" 
        (click)="showQRCode()">
      </ion-icon>
    </ion-card-content>
  </ion-card>

  <!-- 功能按钮卡片 -->
  <ion-card>
    <ion-card-content>
      <div class="grid-4">
        <div class="icon-item" (click)="handleFunctionClick(functionButtons[0])">
          <ion-icon [name]="functionButtons[0]?.icon || 'ticket-outline'"></ion-icon>
          <span>{{ functionButtons[0]?.name || '优惠券' }}</span>
        </div>
        <div class="icon-item" (click)="handleFunctionClick(functionButtons[1])">
          <ion-icon [name]="functionButtons[1]?.icon || 'bag-check-outline'"></ion-icon>
          <span>{{ functionButtons[1]?.name || '订单' }}</span>
        </div>
        <div class="icon-item" (click)="handleFunctionClick(functionButtons[2])">
          <ion-icon [name]="functionButtons[2]?.icon || 'cart-outline'"></ion-icon>
          <span>{{ functionButtons[2]?.name || '购物车' }}</span>
        </div>
        <div class="icon-item" (click)="handleFunctionClick(functionButtons[3])">
          <ion-icon [name]="functionButtons[3]?.icon || 'ellipsis-horizontal-outline'"></ion-icon>
          <span>{{ functionButtons[3]?.name || '更多' }}</span>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
