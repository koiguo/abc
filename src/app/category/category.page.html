<!-- category.page.html -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

<ion-title class="center-title">功能分类</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="openSearch()">
        <ion-icon name="search-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="openSettings()">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">

<!-- 便民生活分类 -->
<div class="category-section">
  <div class="category-header">
    <ion-icon name="home-outline"></ion-icon>
    <span>便民生活</span>
  </div>
  <div class="checkbox-grid">
    <div class="button-item" *ngFor="let item of convenienceItems" (click)="gotoFeature(item.name)">
      <span>{{ item.name }}</span>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>
  </div>
</div>

<!-- 购物娱乐分类 -->
<div class="category-section">
  <div class="category-header">
    <ion-icon name="cart-outline"></ion-icon>
    <span>购物娱乐</span>
  </div>
  <div class="checkbox-grid">
    <div class="button-item" *ngFor="let item of shoppingItems" (click)="gotoFeature(item.name)">
      <span>{{ item.name }}</span>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>
  </div>
</div>

<!-- 理财管理分类 -->
<div class="category-section">
  <div class="category-header">
    <ion-icon name="trending-up-outline"></ion-icon>
    <span>理财管理</span>
  </div>
  <div class="checkbox-grid">
    <div class="button-item" *ngFor="let item of financeItems" (click)="gotoFeature(item.name)">
      <span>{{ item.name }}</span>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>
  </div>
</div>

  <!-- 底部留白 -->
  <div style="height: 20px;"></div>
</ion-content>
