<!-- 消息页面 HTML -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="clearAllMessages()">
        <ion-icon name="trash-outline"></ion-icon>
        <span class="button-label">清扫</span>
      </ion-button>
    </ion-buttons>

    <ion-title class="center-title">信息</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="openContacts()" class="relative-pos">
        <ion-icon name="people-outline"></ion-icon>
        <span class="button-label">通讯录</span>
        <span *ngIf="pendingRequestCount > 0" class="red-dot"></span>
      </ion-button>
      <ion-button (click)="addNewChat()">
        <ion-icon name="add-outline"></ion-icon>
        <span class="button-label">添加</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-toolbar class="search-toolbar">
  <ion-searchbar 
    [(ngModel)]="searchTerm" 
    (ionInput)="filterMessages()"
    placeholder="搜索消息"
    animated="true">
  </ion-searchbar>
</ion-toolbar>

<ion-content class="ion-padding">

  <!-- ✅ 未登录状态（优先显示，不显示其他状态） -->
  <div *ngIf="!isLoggedIn" class="empty-state">
  <ion-icon name="chatbubbles-outline"></ion-icon>
  <p>快去登录开始聊天</p>
  <ion-button 
    (click)="goToLogin()" 
    class="login-btn"
    expand="block"
    shape="round">
    立即登录
  </ion-button>
</div>

  <!-- ✅ 已登录时才显示其他状态 -->
  <ng-container *ngIf="isLoggedIn">
    <!-- 加载中 -->
    <div *ngIf="isLoading" class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>加载中...</p>
    </div>

    <!-- 网络错误 -->
    <div *ngIf="!isLoading && isError" class="empty-state">
      <ion-icon name="wifi-outline"></ion-icon>
      <p>晕，网络出错了</p>
      <ion-button (click)="loadContactsFromApi()" size="small" fill="outline">
        <ion-icon name="refresh-outline" slot="start"></ion-icon>
        点击重试
      </ion-button>
    </div>

    <!-- 无联系人（API成功但无数据） -->
    <div *ngIf="!isLoading && !isError && filteredMessages.length === 0" class="empty-state">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <p>快去添加好友来开启聊天吧！</p>
      <ion-button (click)="addNewChat()" size="small" fill="outline">
        <ion-icon name="person-add-outline" slot="start"></ion-icon>
        添加好友
      </ion-button>
    </div>

    <!-- 消息列表 -->
    <ion-list *ngIf="!isLoading && !isError && filteredMessages.length > 0" class="messages-list">
      <ion-item *ngFor="let message of filteredMessages" class="message-item" (click)="openChat(message.user_id, message.name)">
        
        <ion-avatar slot="start" class="message-avatar">
          <img [src]="message.avatar" alt="avatar">
        </ion-avatar>

        <ion-label>
          <h2>{{ message.name }}</h2>
          <p>{{ message.lastMessage }}</p>
        </ion-label>

        <ion-badge slot="end" *ngIf="message.unread > 0" color="danger">
          {{ message.unread }}
        </ion-badge>
      </ion-item>
      
      <div class="end-tip">
        <ion-text color="medium">—— 到底咯！ ——</ion-text>
      </div>
    </ion-list>
  </ng-container>

</ion-content>
