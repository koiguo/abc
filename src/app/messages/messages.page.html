<!-- 消息页面 HTML -->
<ion-header>
  <ion-toolbar>
    <!-- 左侧：一键清扫按钮 -->
    <ion-buttons slot="start">
      <ion-button (click)="clearAllMessages()">
        <ion-icon name="trash-outline"></ion-icon>
        <span class="button-label">清扫</span>
      </ion-button>
    </ion-buttons>

    <!-- 中间：标题 "信息" 居中 -->
    <ion-title class="center-title">信息</ion-title>

    <!-- 右侧：通讯录 + 添加 -->
    <ion-buttons slot="end">
      <ion-button (click)="openContacts()">
        <ion-icon name="people-outline"></ion-icon>
        <span class="button-label">通讯录</span>
      </ion-button>
      <ion-button (click)="addNewChat()">
        <ion-icon name="add-outline"></ion-icon>
        <span class="button-label">添加</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- 搜索框独立放在 header 下方，占满一整条 -->
<ion-toolbar class="search-toolbar">
  <ion-searchbar 
    [(ngModel)]="searchTerm" 
    (ionInput)="filterMessages()"
    placeholder="搜索消息"
    animated="true">
  </ion-searchbar>
</ion-toolbar>

<ion-content class="ion-padding">
  <!-- 无消息提示 -->
  <div *ngIf="filteredMessages.length === 0" class="empty-state">
    <ion-icon name="chatbubbles-outline" size="large"></ion-icon>
    <p>暂无消息</p>
  </div>

  <!-- 消息列表 -->
  <ion-list *ngIf="filteredMessages.length > 0" class="messages-list">
    <ion-item *ngFor="let message of filteredMessages" class="message-item">
      <ion-avatar slot="start" class="message-avatar">
        <img [src]="message.avatar" alt="avatar">
      </ion-avatar>

      <ion-label>
        <h2>{{ message.name }}</h2>
        <p>{{ message.lastMessage }}</p>
      </ion-label>

      <ion-badge slot="end" *ngIf="message.unread > 0" color="danger">
        {{ message.unread }}
      </ion-badge>
    </ion-item>
    
    <!-- 到底提示 -->
    <div class="end-tip">
      <ion-text color="medium">—— 到底咯！ ——</ion-text>
    </div>
  </ion-list>
</ion-content>
